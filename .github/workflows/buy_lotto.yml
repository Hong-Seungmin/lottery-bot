name: Buy lotto
on:
  schedule:
    - cron: 30 2 * * * # every day on 11:30 AM (KST)
  workflow_dispatch:

jobs:
  build:
    runs-on: [ubuntu-latest]
    name: Buy lotto
    steps:

      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip' # caching pip dependencies
      - run: pip install -r requirements.txt

      - name: Random delay before purchase
        run: |
          DELAY_SECONDS=$(( RANDOM % 1801 ))
          echo "구매 전 ${DELAY_SECONDS}초 동안 랜덤 대기합니다."
          sleep "${DELAY_SECONDS}"

      - name: Run Scripts
        run: make buy # or use 'make buy_lotto' / 'make buy_win720' for granular purchase
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COUNT: ${{ secrets.COUNT }}
          WIN720_LIMIT: ${{ secrets.WIN720_LIMIT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # 스크립트가 아예 시작하지 못한 경우(의존성 설치 실패 등)에는 파이썬 쪽
      # 알림이 돌지 않으므로, 워크플로 차원에서도 실패를 알린다.
      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d disable_web_page_preview=true \
            --data-urlencode "text=🚨 복권 봇: 구매 워크플로 실패
실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
