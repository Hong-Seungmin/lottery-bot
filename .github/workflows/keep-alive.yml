name: Keep GitHub Actions Alive

on:
  schedule:
    # 매주 월요일 새벽 0시(UTC). 예약 워크플로는 저장소가 60일간 활동이 없으면
    # 자동 비활성화되므로, 월 1회보다 주 1회가 안전 여유가 크다.
    # 또한 매주 하트비트 알림을 보내 예약 실행이 멈춘 것을 감지할 수 있게 한다.
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동으로도 실행 가능하게 설정

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 커밋을 푸시하기 위해 권한 필요

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto Commit to Prevent Disabling
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 비어있는 커밋 생성
          git commit --allow-empty -m "chore: keep github actions alive [skip ci]"
          git push

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Send heartbeat
        run: python controller.py heartbeat
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d disable_web_page_preview=true \
            --data-urlencode "text=🚨 복권 봇: Keep Alive 워크플로 실패
실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
