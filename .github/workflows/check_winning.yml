name: Check Winning
on:
  schedule:
    - cron: 0 1 * * 0 # every Sunday on 10:00 AM (KST)
  workflow_dispatch:

jobs:
  build:
    runs-on: [ubuntu-latest]
    name: Check Winning
    steps:

      # ubuntu-latest 가 2026-10-19 부터 Ubuntu 26.04 로 이관되면서 이미지에
      # Python 3.9(2025-10 지원 종료)가 더 이상 포함되지 않는다. 3.9 를 고정해
      # 두면 setup-python 단계에서 바로 실패한다.
      # checkout@v3 / setup-python@v4 는 Node.js 20 지원 종료 경고 대상이다.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # caching pip dependencies
      - run: pip install -r requirements.txt

      - name: Run Scripts
        run: make check # or use 'make check_lotto' / 'make check_win720' for granular check
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COUNT: ${{ secrets.COUNT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # 스크립트가 아예 시작하지 못한 경우(의존성 설치 실패 등)에는 파이썬 쪽
      # 알림이 돌지 않으므로, 워크플로 차원에서도 실패를 알린다.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d disable_web_page_preview=true \
            --data-urlencode "text=🚨 복권 봇: 당첨확인 워크플로 실패"$'\n'"실행 로그: ${RUN_URL}"
